<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Aidan McGowan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111110; --ink-2: #555552; --ink-3: #999996;
    --paper: #fafaf8; --paper-2: #f0f0ec; --accent: #c8502a;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --max: 780px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.25rem 2.5rem; display: flex; justify-content: space-between; align-items: center; background: rgba(250,250,248,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--paper-2); }
  .nav-name { font-family: var(--serif); font-size: 1.1rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 0.85rem; font-weight: 400; color: var(--ink-2); text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.15s; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }

  .contact-main {
    max-width: calc(var(--max) + 4rem);
    margin: 0 auto;
    padding: 12rem 2.5rem 6rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6rem;
    align-items: start;
  }

  .contact-left h1 {
    font-family: var(--serif);
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 1.5rem;
    animation: fadeUp 0.6s 0.1s both;
  }

  .contact-left h1 em { font-style: italic; color: var(--accent); }

  .contact-left p {
    font-size: 1rem;
    color: var(--ink-2);
    line-height: 1.7;
    margin-bottom: 2.5rem;
  }

  .contact-channels { display: flex; flex-direction: column; gap: 1px; }

  .channel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--paper-2);
    text-decoration: none;
    color: inherit;
    transition: padding-left 0.2s;
  }

  .channel:first-child { border-top: 1px solid var(--paper-2); }

  .channel:hover { padding-left: 6px; }

  .channel-name {
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .channel-value {
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--ink);
  }

  .channel-arrow {
    font-size: 0.9rem;
    color: var(--ink-3);
    transition: color 0.15s, transform 0.15s;
  }

  .channel:hover .channel-arrow { color: var(--accent); transform: translateX(3px); }

  /* FORM */
  .contact-right { }

  .form-group { margin-bottom: 1.5rem; }

  label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 0.5rem;
  }

  input, textarea, select {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--paper-2);
    padding: 0.6rem 0;
    font-family: var(--sans);
    font-size: 1rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    border-radius: 0;
  }

  input:focus, textarea:focus, select:focus { border-bottom-color: var(--ink); }

  textarea { resize: vertical; min-height: 100px; }

  select { cursor: pointer; }
  select option { background: var(--paper); }

  .submit-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: none;
    padding: 0.9rem 2rem;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 0.5rem;
  }

  .submit-btn:hover { background: var(--accent); }

  footer { border-top: 1px solid var(--paper-2); padding: 2.5rem; display: flex; justify-content: space-between; align-items: center; max-width: calc(var(--max) + 4rem); margin: 0 auto; }
  footer span { font-size: 0.82rem; color: var(--ink-3); }
  footer .footer-links { display: flex; gap: 1.5rem; }
  footer a { font-size: 0.82rem; color: var(--ink-3); text-decoration: none; transition: color 0.15s; }
  footer a:hover { color: var(--ink); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 700px) {
    nav { padding: 1rem 1.25rem; } .nav-links { gap: 1.25rem; }
    .contact-main { grid-template-columns: 1fr; gap: 3rem; padding: 8rem 1.25rem 4rem; }
    footer { flex-direction: column; gap: 1rem; text-align: center; }
  }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-name">Aidan McGowan</a>
  <ul class="nav-links">
    <li><a href="about.html">About</a></li>
    <li><a href="experience.html">Experience</a></li>
    <li><a href="writing.html">Writing</a></li>
    <li><a href="speaking.html">Speaking</a></li>
    <li><a href="achievements.html">Achievements</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<div class="contact-main">
  <div class="contact-left">
    <h1>Get in <em>touch</em></h1>
    <p>Talk to me, Goose.</p>

    <div class="contact-channels">
      <a href="mailto:aidanmcgowan2@gmail.com" class="channel">
        <span class="channel-name">Email</span>
        <span class="channel-value">aidanmcgowan2@gmail.com</span>
        <span class="channel-arrow">→</span>
      </a>
      <a href="https://www.linkedin.com/in/aidan-mcgowan-656474179/" target="_blank" class="channel">
        <span class="channel-name">LinkedIn</span>
        <span class="channel-value">Aidan McGowan</span>
        <span class="channel-arrow">→</span>
      </a>
      <a href="https://x.com/mcgowanaidan_?s=21" target="_blank" class="channel">
        <span class="channel-name">Twitter / X</span>
        <span class="channel-value">@McGowanAidan_</span>
        <span class="channel-arrow">→</span>
      </a>
    </div>
  </div>

  <div class="contact-right">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="What's on your mind?"></textarea>
    </div>
    <button class="submit-btn" onclick="handleSubmit()">Send message →</button>
  </div>
</div>

<footer>
  <span>© 2025 Aidan McGowan</span>
  <div class="footer-links">
    <a href="https://www.linkedin.com/in/aidan-mcgowan-656474179/">LinkedIn</a>
    <a href="https://x.com/mcgowanaidan_?s=21">Twitter</a>
    <a href="mailto:aidanmcgowan2@gmail.com">Email</a>
  </div>
</footer>

<script>
function handleSubmit() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();
  if (!name || !email || !message) {
    alert('Please fill in your name, email, and message.');
    return;
  }
  const btn = document.querySelector('.submit-btn');
  btn.textContent = 'Sent ✓';
  btn.style.background = '#2a7a4a';
  btn.disabled = true;
}
</script>
</body>
</html>
